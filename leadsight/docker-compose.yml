services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadsight}
      POSTGRES_DB: ${POSTGRES_DB:-leadsight}
    ports:
      # Host 5433 because a local Windows Postgres service already uses 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-leadsight}:${POSTGRES_PASSWORD:-leadsight}@db:5432/${POSTGRES_DB:-leadsight}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-leadsight}:${POSTGRES_PASSWORD:-leadsight}@db:5432/${POSTGRES_DB:-leadsight}
      UPLOAD_DIR: /data/uploads
      # The OpenCode service runs on the host, bound to 127.0.0.1; Docker Desktop proxies host.docker.internal to it.
      OPENCODE_URL: ${OPENCODE_URL_DOCKER:-http://host.docker.internal:4096}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host 3001: 3000 is taken by another local stack, and the Google OAuth redirect is registered on 3001.
      - "${APP_HOST_PORT:-3001}:3000"
    volumes:
      - uploads:/data/uploads
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
  logs:
