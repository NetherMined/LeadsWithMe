services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadsight}
      POSTGRES_DB: ${POSTGRES_DB:-leadsight}
    ports:
      # Host 5433 because a local Windows Postgres service already uses 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
